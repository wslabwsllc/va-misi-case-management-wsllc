openapi: '3.1.1'
info:
  title: Veteran Lookup (synthetic mock)
  description: 'Local, deterministic stand-in for the sample data service (specification 4.6). All data is synthetic; every SSN has an area number of 900-999.'
  version: 1.0.0
paths:
  /veterans/lookup:
    post:
      tags:
        - Veterans
      summary: Look up a veteran by SSN
      description: 'Returns the veteran''s name and address. 404 when the SSN is not in the dataset; 400 when the body is not valid JSON or ssn is missing, null, not a string or empty; 415 when the body is not JSON.'
      operationId: LookupVeteran
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeteranLookupRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeteranLookupResponse'
        '404':
          description: Not Found
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Unsupported Media Type
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
    VeteranLookupRequest:
      required:
        - ssn
      type: object
      properties:
        ssn:
          type: string
    VeteranLookupResponse:
      required:
        - name
        - address
      type: object
      properties:
        name:
          type: string
        address:
          type: string
tags:
  - name: Veterans
