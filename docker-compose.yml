# One-command evaluation:  docker compose up --build     (http://localhost:8080)
# Full test suite:         docker compose run --rm tests             (or scripts/run-all-tests.sh, which also records git metadata and server logs)
# All containers run as linux/amd64 (spec 4.5). The .NET compile steps run natively on the build machine (Dockerfile
# --platform=$BUILDPLATFORM), so Apple Silicon only emulates the running apps, not the SDK build.
# Credentials below are synthetic and local-only. No .env file is needed.
name: caseintake

# The demo app (web + migrator, also their e2e copies): published output on the ASP.NET runtime image.
x-app-image: &app-image
  image: caseintake-app:local
  platform: linux/amd64
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime

# The test runner: SDK, compiled tests and Playwright Chromium. Built only for the tests profile.
x-eval-image: &eval-image
  image: caseintake-eval:local
  platform: linux/amd64
  build:
    context: .
    dockerfile: Dockerfile
    target: eval
    args:
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      GIT_BRANCH: ${GIT_BRANCH:-unknown}
      BUILD_ID: ${BUILD_ID:-local}

# The web container serves static assets (blazor.web.js, CSS, JS modules) from its content root, so it must start
# in its publish folder; both checks below must pass for the container to count as healthy.
x-web-healthcheck: &web-healthcheck
  test: ["CMD-SHELL", "/app/healthcheck.sh 127.0.0.1 8080 /health/ready && /app/healthcheck.sh 127.0.0.1 8080 /_framework/blazor.web.js"]
  interval: 5s
  timeout: 12s
  retries: 30
  start_period: 5s

services:
  db:
    image: postgres:18
    platform: linux/amd64
    environment:
      POSTGRES_USER: caseintake
      POSTGRES_PASSWORD: caseintake_local_only
      POSTGRES_DB: caseintake
    # PostgreSQL 18 images keep data in a versioned folder under /var/lib/postgresql, so the volume mounts there. It is a
    # new volume: PostgreSQL 17 data (the old 'pgdata' volume) cannot be opened by 18 without pg_upgrade.
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseintake -d caseintake"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrator:
    <<: *app-image
    command: ["dotnet", "/app/migrator/CaseIntake.MigrationService.dll"]
    working_dir: /app/migrator
    environment:
      ConnectionStrings__CaseIntake: &conn "Host=db;Port=5432;Database=caseintake;Username=caseintake;Password=caseintake_local_only;Timezone=UTC"
      Seed__DemoPassword: &demo-password "Demo-Passw0rd!"
      Attachments__RootPath: /attachments
    # The migrator reconciles attachment storage (removes stale temporary/unreferenced files) before web starts.
    volumes:
      - attachments:/attachments
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Owned by E4: src/CaseIntake.VeteranLookup.Mock/Dockerfile builds the synthetic lookup mock (POST /veterans/lookup,
  # /health, /openapi/v1.yaml). Not published to the host; web and tests reach it on the Compose network.
  # The probe is inline (same logic as scripts/healthcheck.sh) so it needs only bash, which the Debian/Ubuntu
  # mcr.microsoft.com/dotnet/aspnet images ship; it does not depend on files from the eval image.
  veteran-lookup:
    platform: linux/amd64
    build:
      context: .
      dockerfile: src/CaseIntake.VeteranLookup.Mock/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8081
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /health HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r -t 5 status <&3 && [[ $$status == HTTP/*' 200 '* ]]"]
      interval: 3s
      timeout: 5s
      retries: 30

  web:
    <<: *app-image
    command: ["dotnet", "/app/web/CaseIntake.Web.dll"]
    # Content root = publish folder, so wwwroot (and _framework/blazor.web.js) is found (the image's WORKDIR too); started
    # anywhere else the app answered every asset request with the sign-in redirect.
    working_dir: /app/web
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CaseIntake: *conn
      VeteranLookup__BaseUrl: http://veteran-lookup:8081
      Attachments__RootPath: /attachments
      DataProtection__KeysPath: /dataprotection
      Seed__DemoPassword: *demo-password
      # Test results and evidence written by the tests service (same volume), imported automatically and served only
      # through the authorized evidence endpoint.
      TestResults__RootPath: /test-results
    volumes:
      - attachments:/attachments
      - dataprotection:/dataprotection
      - testresults:/test-results
    depends_on:
      migrator:
        condition: service_completed_successfully
      veteran-lookup:
        condition: service_healthy
    healthcheck: *web-healthcheck

  # ---- Test profile: an isolated copy of the production app for the browser suite (its own database, attachments and
  # results folder), so end-to-end runs never change the demo data. Same image as web; only `tests` uses the eval image. ----
  migrator-e2e:
    <<: *app-image
    profiles: ["tests"]
    command: ["dotnet", "/app/migrator/CaseIntake.MigrationService.dll"]
    working_dir: /app/migrator
    environment:
      ConnectionStrings__CaseIntake: &conn-e2e "Host=db;Port=5432;Database=caseintake_e2e;Username=caseintake;Password=caseintake_local_only;Timezone=UTC"
      Seed__DemoPassword: *demo-password
      Attachments__RootPath: /attachments-e2e
    volumes:
      - attachments-e2e:/attachments-e2e
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web-e2e:
    <<: *app-image
    profiles: ["tests"]
    command: ["dotnet", "/app/web/CaseIntake.Web.dll"]
    working_dir: /app/web
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CaseIntake: *conn-e2e
      VeteranLookup__BaseUrl: http://veteran-lookup:8081
      Attachments__RootPath: /attachments-e2e
      Seed__DemoPassword: *demo-password
      TestResults__RootPath: /e2e-fixtures
      TestResults__ScanInterval: "00:00:00"
    volumes:
      - attachments-e2e:/attachments-e2e
      - testfixtures:/e2e-fixtures
    depends_on:
      migrator-e2e:
        condition: service_completed_successfully
      veteran-lookup:
        condition: service_healthy
    healthcheck: *web-healthcheck

  tests:
    <<: *eval-image
    profiles: ["tests"]
    command: ["/src/scripts/run-tests.sh"]
    environment:
      TESTKIT_POSTGRES_ADMIN: "Host=db;Port=5432;Database=postgres;Username=caseintake;Password=caseintake_local_only"
      VeteranLookup__BaseUrl: http://veteran-lookup:8081
      E2E_BASE_URL: http://web-e2e:8080
      E2E_FIXTURES_ROOT: /e2e-fixtures
      E2E_TRACE: ${E2E_TRACE:-}
      E2E_VIDEO: ${E2E_VIDEO:-}
      GIT_COMMIT: ${GIT_COMMIT:-}
      GIT_BRANCH: ${GIT_BRANCH:-}
      BUILD_ID: ${BUILD_ID:-}
      TEST_RUN_KEY: ${TEST_RUN_KEY:-}
      CAPTURE_SERVER_LOGS: ${CAPTURE_SERVER_LOGS:-}
    volumes:
      - testresults:/results
      - testfixtures:/e2e-fixtures
    depends_on:
      db:
        condition: service_healthy
      veteran-lookup:
        condition: service_healthy
      web-e2e:
        condition: service_healthy

volumes:
  pgdata18:
  attachments:
  attachments-e2e:
  dataprotection:
  testresults:
  testfixtures:
