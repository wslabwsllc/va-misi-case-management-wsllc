<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Decorative sign-in artwork (original, no external image): case cards moving through the five-stage workflow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f6cbd"/>
      <stop offset="0.55" stop-color="#0c4f8f"/>
      <stop offset="1" stop-color="#0a2e4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4a9ae0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4a9ae0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04182b" flood-opacity="0.45"/>
    </filter>
    <!-- One case card: title bar, text lines, a status pill and an owner avatar. -->
    <g id="card">
      <rect width="360" height="190" rx="18" fill="#ffffff"/>
      <rect x="24" y="26" width="180" height="16" rx="8" fill="#0f6cbd"/>
      <rect x="24" y="58" width="300" height="10" rx="5" fill="#d6e4f3"/>
      <rect x="24" y="80" width="260" height="10" rx="5" fill="#d6e4f3"/>
      <rect x="24" y="102" width="210" height="10" rx="5" fill="#d6e4f3"/>
      <circle cx="44" cy="152" r="18" fill="#ebf3fc"/>
      <circle cx="44" cy="146" r="6" fill="#0f6cbd"/>
      <path d="M33 162 a11 9 0 0 1 22 0 z" fill="#0f6cbd"/>
      <rect x="72" y="144" width="110" height="10" rx="5" fill="#d6e4f3"/>
    </g>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#dots)"/>
  <circle cx="620" cy="220" r="320" fill="url(#glow)"/>
  <circle cx="120" cy="860" r="280" fill="url(#glow)"/>

  <!-- Stacked case cards (back to front), each with a different status pill. -->
  <g filter="url(#shadow)">
    <g transform="translate(330 150) rotate(8)" opacity="0.55">
      <use href="#card"/>
      <rect x="236" y="140" width="100" height="28" rx="14" fill="#e9f7e9"/><circle cx="256" cy="154" r="6" fill="#0b5a0b"/>
    </g>
    <g transform="translate(250 250) rotate(3)" opacity="0.8">
      <use href="#card"/>
      <rect x="236" y="140" width="100" height="28" rx="14" fill="#fff4ce"/><circle cx="256" cy="154" r="6" fill="#6b3a00"/>
    </g>
    <g transform="translate(150 360) rotate(-4)">
      <use href="#card"/>
      <rect x="236" y="140" width="100" height="28" rx="14" fill="#f5effc"/><circle cx="256" cy="154" r="6" fill="#5b2a86"/>
    </g>
  </g>

  <!-- Workflow path: New, Triaged, In Progress done; Resolved current; Closed upcoming. -->
  <g fill="none" stroke-linecap="round">
    <path d="M120 760 C 240 700 320 820 420 760 S 600 700 690 760" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6"/>
    <path d="M120 760 C 240 700 320 820 420 760 S 520 728 560 736" stroke="#7fc4ff" stroke-width="6"/>
  </g>
  <g>
    <circle cx="120" cy="760" r="22" fill="#2b88d8" stroke="#ffffff" stroke-width="4"/>
    <path d="M110 760 l7 7 l13 -14" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="265" cy="748" r="22" fill="#2b88d8" stroke="#ffffff" stroke-width="4"/>
    <path d="M255 748 l7 7 l13 -14" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="420" cy="760" r="22" fill="#2b88d8" stroke="#ffffff" stroke-width="4"/>
    <path d="M410 760 l7 7 l13 -14" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="560" cy="736" r="30" fill="#7fc4ff" fill-opacity="0.25"/>
    <circle cx="560" cy="736" r="20" fill="#ffffff"/>
    <circle cx="560" cy="736" r="9" fill="#0f6cbd"/>
    <circle cx="690" cy="760" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4"/>
  </g>

  <!-- Verified badge -->
  <g transform="translate(560 470)" filter="url(#shadow)">
    <circle r="64" fill="#ffffff"/>
    <circle r="50" fill="#0e700e"/>
    <path d="M-22 2 l14 15 l30 -32" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Soft accents -->
  <circle cx="90" cy="180" r="10" fill="#7fc4ff" fill-opacity="0.6"/>
  <circle cx="720" cy="620" r="7" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="80" y="900" width="140" height="10" rx="5" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="80" y="922" width="90" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
</svg>
