<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1b3a" />
  <title>Offline - Case Intake and Triage</title>
  <!-- Self-contained: the service worker shows this page when the server cannot be reached, so it must not depend on
       app.css (the app loads a fingerprinted copy that is not precached). Styles are inline (CSP allows inline styles)
       and the icons carry width and height, so nothing can render unstyled or oversized. Same tokens as app.css. -->
  <style>
    :root {
      --sidebar: #0b1b3a; --brand: #315cf5; --brand-hover: #2348d8; --brand-tint: #eef2ff; --canvas: #f5f6fc;
      --surface: #ffffff; --border: #e4e7ec; --text: #101828; --text-secondary: #5b6478; --focus: #101828;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      padding: 24px 16px; background: var(--canvas); color: var(--text);
      font: 16px/1.5 "Segoe UI", Arial, sans-serif;
    }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--sidebar); font-weight: 700; font-size: 17px; }
    .brand__mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--sidebar); }
    .brand__mark svg { width: 20px; height: 20px; }
    main {
      width: 100%; max-width: 480px; text-align: center; background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; box-shadow: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);
      padding: 40px 32px;
    }
    .status-icon { display: inline-grid; place-items: center; width: 64px; height: 64px; margin-bottom: 16px; border-radius: 50%; background: var(--brand-tint); color: var(--brand); }
    .status-icon svg { width: 32px; height: 32px; }
    h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.3; }
    p { margin: 0 0 8px; color: var(--text-secondary); }
    .actions { margin-top: 24px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 20px;
      border-radius: 10px; background: var(--brand); color: #ffffff; font-weight: 600; text-decoration: none;
    }
    .btn:hover { background: var(--brand-hover); }
    .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .btn svg { width: 18px; height: 18px; }
    @media (max-width: 480px) { main { padding: 32px 20px; } }
  </style>
</head>
<body>
  <div class="brand">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M9 4h6v3H9z"/><path d="M15 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
    </span>
    <span>Case Management</span>
  </div>
  <main id="main">
    <span class="status-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0M12 19h.01M3 3l18 18"/></svg>
    </span>
    <h1>You're offline</h1>
    <p>Case Intake and Triage needs a connection to the server. Nothing was saved on this device.</p>
    <p>Check your network connection, then try again.</p>
    <div class="actions">
      <a class="btn" href="/">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        Try again
      </a>
    </div>
  </main>
</body>
</html>
